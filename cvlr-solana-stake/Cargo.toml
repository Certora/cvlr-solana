[package]
name = "cvlr-solana-stake"
description =  "CVLR model for the Solana Stake Program"
version.workspace = true
edition.workspace = true
license.workspace = true
categories.workspace = true
keywords.workspace = true
authors.workspace = true
documentation.workspace = true
readme.workspace = true
homepage.workspace = true
repository.workspace = true

[features]
default = []
rt = ["cvlr-nondet/rt", "cvlr-asserts/rt", "cvlr-mathint/rt"]

[dependencies]
solana-account-info = { workspace = true }
solana-borsh = { workspace = true }
solana-clock = { workspace = true }
solana-program-error = { workspace = true }
solana-pubkey = { workspace = true }
solana-stake-interface = { workspace = true, features = ["borsh"] }
solana-sysvar = { workspace = true, features = ["bincode"] }
arrayref = { workspace = true }
borsh = { workspace = true }


cvlr-asserts = { workspace = true }
cvlr-nondet = { workspace = true }
cvlr-mathint = { workspace = true }
cvlr-log = { workspace = true }
cvlr-early-panic = { workspace = true }
cvlr-solana = { workspace = true }



